[project]
name = "imagegencam"
version = "0.1.0"
description = "ImageGenCam for Raspberry Pi Zero 2 W, Picamera2, Display HAT Mini, and OpenAI image edits."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.109.0",
  "qrcode>=8.2",
  "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/imagegencam/quest"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
